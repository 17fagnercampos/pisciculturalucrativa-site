# Painel de edição do site: https://app.pagescms.org (entre com a conta do GitHub)
media:
  input: fotos
  output: /fotos
content:
- name: textos
  label: Textos da página
  type: file
  path: conteudo/site.yml
  format: yaml
  fields:
  - name: seo
    label: Google (título e resumo que aparecem na busca)
    type: object
    fields:
    - { name: titulo, label: Título no Google, type: string }
    - { name: descricao, label: Resumo no Google (até ~160 letras), type: text }
  - name: mensagens_whatsapp
    label: Mensagens que já vêm escritas no WhatsApp
    type: object
    fields:
    - { name: parceria, label: "Botões \"Quero ser Parceiro\"", type: text }
    - { name: geral, label: "Demais botões (Falar com Especialista, Conversar Agora, flutuante)", type: text }
  - name: topo
    label: 1 · Topo da página
    type: object
    fields:
    - { name: selo, label: Selo acima do título, type: string }
    - { name: titulo, label: Título (parte branca), type: string }
    - { name: titulo_destaque, label: Título (parte amarela), type: string }
    - { name: texto, label: "Texto (palavras entre *asteriscos* ficam amarelas)", type: text }
    - { name: botao_principal, label: Botão Quero ser Parceiro, type: string }
    - { name: botao_whatsapp, label: Botão verde, type: string }
  - name: sobre
    label: 2 · Sobre
    type: object
    fields:
    - { name: titulo, label: Título, type: string }
    - { name: subtitulo, label: "Subtítulo (palavras entre *asteriscos* ficam em azul)", type: text }
    - { name: historia_titulo, label: Título da história, type: string }
    - { name: historia, label: "História (linha em branco separa parágrafos)", type: text }
    - name: pilares
      label: Missão, Visão e Valores
      type: object
      list: true
      fields:
      - { name: titulo, label: Título, type: string }
      - { name: texto, label: Texto, type: text }
    - { name: chamada_titulo, label: Faixa colorida · título, type: string }
    - { name: chamada_texto, label: Faixa colorida · texto, type: text }
    - { name: chamada_botao, label: Faixa colorida · botão, type: string }
  - name: parcerias
    label: 3 · Parcerias
    type: object
    fields:
    - { name: selo, label: Selo, type: string }
    - { name: titulo, label: Título, type: string }
    - { name: subtitulo, label: Subtítulo, type: text }
    - name: vantagens
      label: Vantagens (cartões)
      type: object
      list: true
      fields:
      - { name: titulo, label: Título, type: string }
      - { name: texto, label: Texto, type: text }
      - name: icone
        label: Ícone
        type: select
        options:
          values:
          - { value: trending-up, label: Gráfico subindo }
          - { value: dollar-sign, label: Cifrão }
          - { value: clock, label: Relógio }
          - { value: map-pin, label: Localização }
          - { value: shield, label: Escudo }
          - { value: users, label: Pessoas }
          - { value: zap, label: Raio }
          - { value: target, label: Alvo }
    - { name: passos_titulo, label: Título dos passos, type: string }
    - name: passos
      label: Passos (01, 02, 03...)
      type: object
      list: true
      fields:
      - { name: titulo, label: Título, type: string }
      - { name: texto, label: Texto, type: text }
  - name: modelo
    label: 4 · Modelo de parceria (20%)
    type: object
    fields:
    - { name: titulo, label: Título, type: string }
    - { name: itens, label: Itens, type: string, list: true }
    - { name: numero, label: Número grande, type: string }
    - { name: numero_rotulo, label: Abaixo do número, type: string }
    - { name: numero_detalhe, label: Detalhe pequeno, type: string }
    - { name: frase, label: Frase final, type: text }
  - name: mercado
    label: 5 · Números do mercado
    type: object
    fields:
    - { name: titulo, label: Título, type: string }
    - { name: mostrar, label: Mostrar esta seção, type: boolean }
    - name: numeros
      label: Números
      type: object
      list: true
      fields:
      - { name: valor, label: Número, type: string }
      - { name: rotulo, label: O que é, type: string }
  - name: proximo_passo
    label: 6 · Dê o Próximo Passo
    type: object
    fields:
    - { name: titulo, label: Título, type: string }
    - { name: texto, label: Texto, type: text }
    - { name: botao, label: Botão, type: string }
  - name: contato
    label: 7 · Contato
    type: object
    fields:
    - { name: titulo, label: Título, type: string }
    - { name: subtitulo, label: Subtítulo, type: text }
    - { name: coluna_titulo, label: Título da coluna de contatos, type: string }
    - { name: botao_whatsapp, label: Botão verde, type: string }
    - { name: form_titulo, label: Formulário · título, type: string }
    - { name: form_texto, label: Formulário · texto, type: text }
    - { name: botao_form, label: Formulário · botão, type: string }
  - name: rodape
    label: 8 · Rodapé
    type: object
    fields:
    - { name: texto, label: Texto ao lado do logo, type: text }
    - { name: linha, label: Linha final, type: string }
- name: politica-de-privacidade
  label: "Página: Política de Privacidade"
  type: file
  path: conteudo/paginas/politica-de-privacidade.md
  format: yaml-frontmatter
  fields:
  - { name: titulo, label: Título, type: string }
  - { name: descricao, label: Resumo para o Google, type: text }
  - name: body
    label: Texto
    type: rich-text
    options:
      format: markdown
- name: exclusao-de-dados
  label: "Página: Exclusão de dados"
  type: file
  path: conteudo/paginas/exclusao-de-dados.md
  format: yaml-frontmatter
  fields:
  - { name: titulo, label: Título, type: string }
  - { name: descricao, label: Resumo para o Google, type: text }
  - name: body
    label: Texto
    type: rich-text
    options:
      format: markdown
- name: config
  label: Configurações (WhatsApp, logo, redes, Pixel)
  type: file
  path: conteudo/config.yml
  format: yaml
  fields:
  - { name: dominio, label: Endereço do site (não mexer), type: string }
  - { name: nome, label: Nome da empresa, type: string }
  - { name: whatsapp, label: WhatsApp (só números, com 55), type: string }
  - { name: whatsapp_legivel, label: WhatsApp (como aparece no site), type: string }
  - { name: email, label: E-mail de contato, type: string }
  - { name: horario, label: Horário de atendimento, type: string }
  - { name: localizacao, label: Localização, type: string }
  - { name: logo, label: "Logo (opcional; vazio usa o logo padrão)", type: image }
  - { name: instagram, label: Instagram (link completo), type: string }
  - { name: facebook, label: Facebook (link completo), type: string }
  - { name: tiktok, label: TikTok (link completo), type: string }
  - { name: google_analytics_id, label: "ID do Google Analytics (ex. G-XXXXXXX)", type: string }
  - { name: meta_pixel_id, label: ID do Pixel da Meta, type: string }
