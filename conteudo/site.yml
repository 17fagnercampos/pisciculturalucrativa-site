seo:
  titulo: Piscicultura Lucrativa · Hub Nacional de Pisciculturas | Parcerias Piscicultura Brasil
  descricao: "Piscicultura Lucrativa: hub nacional que conecta pisciculturas e produtores de alevinos a clientes em todo o Brasil. Sem custo fixo: 20% sobre as vendas realizadas."

topo:
  selo: Líder em Atendimentos
  titulo: "#1 Hub Nacional de"
  titulo_destaque: Pisciculturas do Brasil
  texto: "Conectamos *piscicultores* e clientes em todo o Brasil. *Escale suas vendas de piscicultura, reduza custos* e foque na produção de *alevinos de qualidade* enquanto cuidamos das suas vendas."
  botao_principal: Quero ser Parceiro
  botao_whatsapp: WhatsApp
  mensagem_whatsapp: Olá, tenho interesse em saber mais sobre a parceria com a Piscicultura Lucrativa.

sobre:
  titulo: Sobre a Piscicultura Lucrativa
  subtitulo: Somos especialistas em conectar piscicultores de qualidade com o mercado nacional de piscicultura, criando um ecossistema próspero para todos os envolvidos na aquicultura brasileira.
  historia_titulo: Nossa História
  historia: |
    A Piscicultura Lucrativa nasceu da necessidade de conectar produtores de alevinos de alta qualidade com piscicultores em todo o Brasil. Identificamos que muitas pisciculturas gastavam tempo excessivo com vendas e marketing, quando deveriam focar na sua expertise: produção de qualidade.

    Nossa solução cria um hub nacional que qualifica clientes, organiza pedidos e maximiza a eficiência logística, permitindo que nossos parceiros escalem suas vendas sem comprometer a qualidade ou aumentar custos operacionais.
  pilares:
    - titulo: Missão
      texto: Conectar pisciculturas de excelência com o mercado nacional, maximizando vendas e otimizando operações.
    - titulo: Visão
      texto: Ser o principal hub de piscicultura do Brasil, referência em qualidade e inovação no setor.
    - titulo: Valores
      texto: Transparência, confiança, inovação e compromisso com a excelência em cada parceria.
  chamada_titulo: Pronto para conhecer nossa proposta completa?
  chamada_texto: Nossa equipe está preparada para apresentar como podemos revolucionar as vendas da sua piscicultura.
  chamada_botao: Conversar Agora
  mensagem_whatsapp: Olá, gostaria de conhecer mais sobre a Piscicultura Lucrativa e seus serviços.

