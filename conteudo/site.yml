  vantagens:
    - titulo: Vendas Escaláveis
      texto: Fluxo constante de clientes qualificados, prontos para comprar em volumes significativos.
      icone: grafico
    - titulo: Zero Risco Financeiro
      texto: Sem custo fixo! Você paga apenas 20% sobre as vendas realizadas.
      icone: escudo
    - titulo: Mais Tempo para Produção
      texto: Foque na sua expertise enquanto cuidamos de todo o processo de vendas.
      icone: relogio
    - titulo: Logística Otimizada
      texto: Pedidos organizados por rotas para maximizar eficiência nas entregas.
      icone: rota
  passos_titulo: Como Funciona Nossa Parceria?
  passos:
    - titulo: Divulgação Inteligente
      texto: Investimos estrategicamente em marketing para atrair clientes qualificados que estão prontos para comprar.
    - titulo: Atendimento Profissionalizado
      texto: Nossa equipe cuida de todo atendimento inicial, filtrando apenas pedidos relevantes e de maior valor.
    - titulo: Gestão de Pedidos
      texto: Classificamos pedidos por cidades e rotas e organizamos todas as informações para sua piscicultura.

